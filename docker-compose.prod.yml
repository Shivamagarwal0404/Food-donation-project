# =============================================================================
# FoodShare — Production Docker Compose
# Architecture:
#   Internet → Nginx (:80)
#                ├── React production SPA (/usr/share/nginx/html)
#                ├── /static/ → staticfiles volume
#                ├── /media/  → media_data volume
#                └── /api/ & /django-admin/ → Gunicorn:8000 (backend)
#                                               └── External PostgreSQL RDS
#
# Usage:
#   1. Copy .env.prod.example to .env.prod and configure secrets / RDS endpoint.
#   2. Build and start services:
#      docker compose -f docker-compose.prod.yml up -d --build
# =============================================================================

services:
  # ── React Frontend Builder ──────────────────────────────────────────────────
  # Builds Vite production distribution with relative API base (/api/v1)
  # and writes output to the shared frontend_dist volume for Nginx.
  frontend-builder:
    image: node:20-alpine
    container_name: foodshare_frontend_builder
    working_dir: /app
    environment:
      - VITE_API_BASE_URL=/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend_dist:/output
    command: sh -c "npm ci && npm run build && rm -rf /output/* && cp -r dist/. /output/"

  # ── Django Backend (Gunicorn WSGI) ──────────────────────────────────────────
  # Python 3.12-slim container running Gunicorn on port 8000.
  # Connects directly to external AWS RDS PostgreSQL database.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodshare_backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    volumes:
      - staticfiles:/app/staticfiles
      - media_data:/app/media
    command: gunicorn config.wsgi:application -c gunicorn.conf.py

  # ── Nginx Web Server & Reverse Proxy ────────────────────────────────────────
  # Public entrypoint on port 80. Serves React SPA & static assets directly,
  # proxies API and admin traffic to Gunicorn.
  nginx:
    image: nginx:alpine
    container_name: foodshare_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - staticfiles:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      backend:
        condition: service_started
      frontend-builder:
        condition: service_completed_successfully

# ── Persistent Shared Named Volumes ───────────────────────────────────────────
volumes:
  staticfiles:
  media_data:
  frontend_dist:
