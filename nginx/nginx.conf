# =============================================================================
# FoodShare — Nginx configuration
# Production: serves static/media directly, proxies API to Gunicorn,
#             and serves the built React app.
# =============================================================================

upstream django_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;   # Replace with your domain in production

    # Maximum upload size (for food donation photos)
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API → Django/Gunicorn ---
    location /api/ {
        proxy_pass         http://django_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Django admin ---
    location /django-admin/ {
        proxy_pass         http://django_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Django static files ---
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Media files (local dev; use S3 in production) ---
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # --- React SPA (serve index.html for all frontend routes) ---
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}

